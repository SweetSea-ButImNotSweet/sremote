<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">

</head>
<body>
  <!-- Top Navigation Header -->
  <nav style="display:flex; justify-content:space-between; align-items:center; padding:12px 20px; background:#0f172a; border-bottom:1px solid rgba(255,255,255,0.08); font-size:13px; font-family:-apple-system,BlinkMacSystemFont,sans-serif;">

  <div class="pomodoro-card">
    <div class="mode-badge" id="mode-badge">🎯 Chế độ Tập trung</div>

    <!-- Nút điều khiển -->

      <button id="btn-start" class="btn btn-primary">Bắt đầu</button>

      <button id="btn-reset" class="btn btn-secondary">Đặt lại</button>

    <div class="lofi-container">
