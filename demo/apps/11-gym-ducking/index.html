<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App 11: Smart Gym HIIT Audio Ducking - SRemote Demo</title>
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="style.css">
  <script src="../common.js"></script>
</head>
<body>

  <main class="demo-main-layout">
    <div class="gym-app">
      <!-- Thẻ trạng thái Hiệp tập / Nghỉ ngơi -->
      <div class="phase-card prepare-phase" id="phase-card">
        <div class="round-indicator" id="round-indicator">HIỆP 1 / 8</div>
        <div class="phase-name" id="phase-name">CHUẨN BỊ</div>
        <div class="timer-countdown" id="timer-countdown">05</div>
      </div>

      <!-- Nút điều khiển tập luyện -->
      <div class="controls-row">
        <button id="btn-start-workout" class="btn btn-primary btn-large">
          <span class="btn-icon" id="start-icon"></span>
          <span>Bắt Đầu Tập</span>
        </button>
        <button id="btn-pause-workout" class="btn btn-secondary btn-large">
          <span class="btn-icon" id="pause-icon"></span>
          <span>Tạm Dừng</span>
        </button>
      </div>

      <!-- Khung nhạc nền Gym Workout & Audio Ducking Status -->
      <div class="music-section flat-card">
        <div class="music-header">
          <div class="music-title-wrap">
            <span class="music-note-icon">🎧</span>
            <div>
              <strong>Nhạc nền Gym EDM Remix</strong>
              <div class="music-sub">Tự động giảm âm lượng (Ducking) còn 20% khi có tiếng đếm nhịp</div>
            </div>
          </div>
          <span id="ducking-status" class="ducking-badge">Bình thường (100%)</span>
        </div>
        <div id="workout-music-slot" class="music-slot"></div>
      </div>
    </div>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
