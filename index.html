<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SRemote - Universal Embedded Media Controller</title>
  <meta name="description" content="SRemote Documentation Hub - Root Ecosystem, Userscript, Wrapper & Ready2Use">

  <!-- Marked.js via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- Highlight.js for Syntax Highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/vs2015.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <link rel="stylesheet" href="assets/css/header.css">
  <link rel="stylesheet" href="style.css">
  <script src="assets/js/header.js" defer></script>
</head>
<body>
  <!-- Shared Header Component -->
  <sremote-header active="home"></sremote-header>

  <!-- Main 2-Column Clean Layout -->
  <div class="app-layout">
    <!-- Left Sidebar: Package Readme Selector -->
    <aside class="sidebar">
      <div class="panel">
        <div class="panel-heading">
          <span id="label-sidebar-title">📚 Tài liệu README</span>
        </div>
        <div class="panel-body">
          <nav class="toc-list" id="readme-nav-list">
            <button type="button" class="toc-link active" data-target="root" id="btn-doc-root">
              <span>🌐 <strong>SRemote Monorepo</strong></span>
              <span class="toc-badge">Root</span>
            </button>
            <button type="button" class="toc-link" data-target="userscript" id="btn-doc-userscript">
              <span>🔌 <strong>SRemote Userscript</strong></span>
              <span class="toc-badge">Extension</span>
            </button>
            <button type="button" class="toc-link" data-target="wrapper" id="btn-doc-wrapper">
              <span>📦 <strong>@sremote/wrapper</strong></span>
              <span class="toc-badge">SDK</span>
            </button>
            <button type="button" class="toc-link" data-target="ready2use" id="btn-doc-ready2use">
              <span>🚀 <strong>@sremote/ready2use</strong></span>
              <span class="toc-badge">Presets</span>
            </button>
          </nav>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <div class="panel">
        <div class="panel-heading">
          <div class="doc-heading-row">
            <h1 id="sec-doc-title" class="doc-heading-title">📖 Tài liệu Kỹ thuật</h1>
          </div>
          <span id="doc-renderer-badge" class="doc-renderer-badge">Rendered by <strong>Marked.js</strong></span>
        </div>
        <div class="panel-body">
          <!-- Dynamic Markdown Container -->
          <article class="markdown-body" id="markdown-container">
            <div class="loading-spinner">Đang tải và xử lý nội dung Markdown...</div>
          </article>
        </div>
      </div>
    </main>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-inner">
      <p id="footer-text">
        SRemote Frame Controller &copy; 2026 sweetsea &bull; Giấy phép LGPL-3.0 &bull; Hỗ trợ mọi trình duyệt & Tampermonkey.
      </p>
    </div>
  </footer>

  <!-- Script: UI Logic & Live Markdown Loader with Prefetch Cache -->
  <script>
    const DOC_SOURCES = {
      root: {
        vi: { title: "SRemote - Monorepo Overview", file: "README/vi.md" },
        en: { title: "SRemote - Monorepo Overview", file: "README.md" }
      },
      userscript: {
        vi: { title: "SRemote Userscript - Cầu nối & Hướng dẫn", file: "packages/userscript/README/vi.md" },
        en: { title: "SRemote Userscript - Bridge & Setup Guide", file: "packages/userscript/README.md" }
      },
      wrapper: {
        vi: { title: "@sremote/wrapper - Client SDK", file: "packages/wrapper/README.md" },
        en: { title: "@sremote/wrapper - Client SDK", file: "packages/wrapper/README.md" }
      },
      ready2use: {
        vi: { title: "@sremote/ready2use - Player Presets", file: "packages/ready2use/README.md" },
        en: { title: "@sremote/ready2use - Player Presets", file: "packages/ready2use/README.md" }
      }
    };

    const i18nUI = {
      en: {
        pageTitle: "SRemote - Universal Embedded Media Controller",
        sidebarTitle: "📚 Documentation Hub",
        footerText: "SRemote Frame Controller © 2026 sweetsea • Licensed under LGPL-3.0 • Supports all browsers & Tampermonkey.",
        rootBadge: "Root",
        userscriptBadge: "Extension",
        wrapperBadge: "SDK",
        ready2useBadge: "Presets"
      },
      vi: {
        pageTitle: "SRemote - Universal Embedded Media Controller",
        sidebarTitle: "📚 Tài liệu README",
        footerText: "SRemote Frame Controller © 2026 sweetsea • Giấy phép LGPL-3.0 • Hỗ trợ mọi trình duyệt & Tampermonkey.",
        rootBadge: "Root",
        userscriptBadge: "Extension",
        wrapperBadge: "SDK",
        ready2useBadge: "Presets"
      }
    };

    // Cache lưu trữ nội dung thô của các file markdown
    const mdCache = new Map();
    let currentLang = 'vi';
    let currentDocTarget = 'root';

    // Configure Marked.js options
    if (typeof marked !== 'undefined') {
      marked.use({
        gfm: true,
        breaks: true,
        mangle: false,
        highlight: function(code, lang) {
          if (typeof hljs !== 'undefined') {
            const language = hljs.getLanguage(lang) ? lang : 'plaintext';
            return hljs.highlight(code, { language }).value;
          }
          return code;
        }
      });
    }

    // Helper: Parse GitHub Alerts (> [!NOTE], > [!TIP], etc.)
    function renderGfmAlerts(html) {
      const alertTypes = {
        NOTE: { title: 'Note', icon: 'ℹ️', class: 'gfm-alert-note' },
        TIP: { title: 'Tip', icon: '💡', class: 'gfm-alert-tip' },
        IMPORTANT: { title: 'Important', icon: '🔔', class: 'gfm-alert-important' },
        WARNING: { title: 'Warning', icon: '⚠️', class: 'gfm-alert-warning' },
        CAUTION: { title: 'Caution', icon: '🛑', class: 'gfm-alert-caution' },
      };

      return html.replace(/<blockquote>([\s\S]*?)<\/blockquote>/gi, (match, inner) => {
        const alertMatch = inner.match(/^\s*<p>\s*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\](?:\s*<br\s*\/?>|\s*\n)?([\s\S]*)$/i);
        if (!alertMatch) return match;

        const type = alertMatch[1].toUpperCase();
        const alert = alertTypes[type] || alertTypes.NOTE;
        let body = inner.replace(/^\s*<p>\s*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\](?:\s*<br\s*\/?>|\s*\n)?/i, '<p>');
        body = body.replace(/<p>\s*<\/p>/gi, '');

        return `
          <div class="gfm-alert ${alert.class}">
            <div class="gfm-alert-title">${alert.icon} ${alert.title}</div>
            ${body}
          </div>
        `;
      });
    }

    // Tải nội dung markdown và lưu vào cache
    async function fetchMarkdownText(sourceFile) {
      if (mdCache.has(sourceFile)) {
        return mdCache.get(sourceFile);
      }

      const res = await fetch(sourceFile + '?t=' + Date.now());
      if (!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);

      let markdownText = await res.text();
      // Loại bỏ liên kết toggle ngôn ngữ ở đầu file markdown nếu có
      markdownText = markdownText.replace(/^\[\s*(English|Tiếng Việt)[\s\S]*?\n\n/i, '');

      mdCache.set(sourceFile, markdownText);
      return markdownText;
    }

    // Prefetch toàn bộ file markdown
    function prefetchAllMarkdownDocs() {
      Object.values(DOC_SOURCES).forEach(pkg => {
        ['vi', 'en'].forEach(l => {
          if (pkg[l] && pkg[l].file && !mdCache.has(pkg[l].file)) {
            fetchMarkdownText(pkg[l].file).catch(() => {});
          }
        });
      });
    }

    // Render markdown ra giao diện
    async function loadDocument(target = currentDocTarget) {
      currentDocTarget = target;
      const targetConfig = DOC_SOURCES[target] ? (DOC_SOURCES[target][currentLang] || DOC_SOURCES[target].en) : DOC_SOURCES.root.en;
      const sourceFile = targetConfig.file;
      const container = document.getElementById('markdown-container');
      const secTitle = document.getElementById('sec-doc-title');
      if (!container) return;

      // Update sidebar active state
      document.querySelectorAll('#readme-nav-list .toc-link').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-target') === target);
      });

      if (secTitle) {
        secTitle.textContent = targetConfig.title;
      }

      // Update URL search query
      const url = new URL(window.location.href);
      url.searchParams.set('doc', target);
      window.history.replaceState({ doc: target }, '', url.toString());

      if (!mdCache.has(sourceFile)) {
        container.innerHTML = '<div class="loading-spinner">Đang tải và xử lý nội dung Markdown...</div>';
      }

      try {
        const markdownText = await fetchMarkdownText(sourceFile);

        if (typeof marked !== 'undefined') {
          let html = marked.parse(markdownText);
          html = renderGfmAlerts(html);
          container.innerHTML = html;
          if (typeof hljs !== 'undefined') {
            container.querySelectorAll('pre code').forEach((block) => {
              hljs.highlightElement(block);
            });
          }
        } else {
          container.innerHTML = `<pre>${markdownText}</pre>`;
        }
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (err) {
        console.error('Lỗi khi tải file markdown:', err);
        container.innerHTML = `
          <div style="border-left: 4px solid #d9534f; background: #fdf7f7; color: #a94442; padding: 12px; border-radius: 3px;">
            <h4 style="margin-bottom: 6px;">⚠️ Không thể tải file tài liệu Markdown (${sourceFile})</h4>
            <p>Chi tiết lỗi: ${err.message}. Vui lòng kiểm tra lại đường dẫn file hoặc web server.</p>
          </div>
        `;
      }
    }

    function setLanguage(lang) {
      if (!i18nUI[lang]) return;
      currentLang = lang;
      localStorage.setItem('sremote_lang', lang);
      document.documentElement.lang = lang;

      // Cập nhật text tiêu đề & footer
      document.title = i18nUI[lang].pageTitle;
      const sidebarTitle = document.getElementById('label-sidebar-title');
      if (sidebarTitle) sidebarTitle.textContent = i18nUI[lang].sidebarTitle;
      const footer = document.getElementById('footer-text');
      if (footer) footer.textContent = i18nUI[lang].footerText;

      // Render lại document hiện tại với ngôn ngữ mới
      loadDocument(currentDocTarget);
    }

    document.addEventListener('DOMContentLoaded', () => {
      const savedLang = localStorage.getItem('sremote_lang') || 'vi';
      const params = new URLSearchParams(window.location.search);
      const requestedDoc = params.get('doc');
      if (requestedDoc && DOC_SOURCES[requestedDoc]) {
        currentDocTarget = requestedDoc;
      }

      // Gán sự kiện click cho các nút bên trái
      document.querySelectorAll('#readme-nav-list .toc-link').forEach(btn => {
        btn.addEventListener('click', () => {
          const target = btn.getAttribute('data-target');
          if (target && DOC_SOURCES[target]) {
            loadDocument(target);
          }
        });
      });

      // Lắng nghe thay đổi ngôn ngữ từ Header
      window.addEventListener('i18n:changed', e => {
        if (e.detail?.lang && e.detail.lang !== currentLang) {
          setLanguage(e.detail.lang);
        }
      });

      setLanguage(savedLang);
      prefetchAllMarkdownDocs();
    });
  </script>
</body>
</html>
