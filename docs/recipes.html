<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SRemote - Hướng dẫn triển khai (Recipes)</title>
  <meta name="description" content="Thư viện code nhúng mẫu và Adapter kết nối SRemote cho YouTube, Spotify, SoundCloud, Vimeo, Bilibili và HTML5.">

  <!-- Highlight.js for Syntax Highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/vs2015.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <!-- Dùng chung bộ CSS Flat UI của hệ thống & CSS riêng của Cookbook -->
  <link rel="stylesheet" href="../assets/css/header.css">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="assets/css/recipes.css">
  <script src="../assets/js/header.js" defer></script>
</head>
<body>

  <!-- Top Navbar / Header Component -->
  <sremote-header active="cookbook"></sremote-header>

  <!-- Main Cookbook Grid -->
  <div class="cookbook-layout">

    <!-- Left Sidebar: Platform Selector -->
    <aside class="sidebar">
      <div class="panel">
        <div class="panel-heading">
          <span id="label-sidebar-title">🎯 Nền tảng</span>
        </div>
        <div class="panel-body" style="padding: 6px;">
          <div id="platform-list">
            <!-- Platform item list dynamically generated -->
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Live Workspace -->
    <main>
      <div class="panel">
        <div class="panel-body">
          <div class="split-view">

            <!-- Left Side: Code Generator -->
            <div class="code-column">
              <!-- Top Mode Selector Tabs -->
              <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; flex-wrap: wrap; gap: 8px;">
                <div class="code-tab-group" role="tablist" style="width: 100%; justify-content: flex-start;">
                  <button type="button" class="code-tab-btn active" id="tab-js-ready2use" onclick="switchJsTab('ready2use')">✨ @sremote/ready2use</button>
                  <button type="button" class="code-tab-btn" id="tab-js-wrapper" onclick="switchJsTab('wrapper')">⚡ @sremote/wrapper</button>
                  <button type="button" class="code-tab-btn" id="tab-js-vanilla" onclick="switchJsTab('vanilla')">🌐 Vanilla (window.sremote)</button>
                </div>
              </div>

              <!-- Block 1: HTML Embed (Hidden when using @sremote/ready2use) -->
              <div class="code-block-wrapper" id="code-block-html-wrapper" style="display: none; margin-bottom: 14px;">
                <div class="code-block-header">
                  <span class="code-block-title" id="label-html-block">📄 1. Mã nhúng HTML (HTML Embed)</span>
                  <button type="button" class="btn-copy-code" onclick="copyCodeSnippet('html')" id="btn-copy-html">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    <span id="copy-html-label">Sao chép HTML</span>
                  </button>
                </div>
                <div class="code-container">
                  <pre><code class="hljs" id="code-snippet-html"></code></pre>
                </div>
              </div>

              <!-- Block 2: JS Adapter / Setup -->
              <div class="code-block-wrapper" id="code-block-js-wrapper">
                <div class="code-block-header">
                  <span class="code-block-title" id="label-js-block">✨ Cài đặt & Sử dụng (JavaScript)</span>
                  <button type="button" class="btn-copy-code" onclick="copyCodeSnippet('js')" id="btn-copy-js">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    <span id="copy-js-label">Sao chép JS</span>
                  </button>
                </div>
                <div class="code-container">
                  <pre><code class="hljs" id="code-snippet-js"></code></pre>
                </div>
              </div>
            </div>

            <!-- Right Side: Live Sandbox & Preview Controls -->
            <div class="preview-column">
              <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <h4 style="margin: 0; font-size: 13.5px; font-weight: 700;" id="label-live-preview">Xem trước</h4>
                <span id="status-indicator" style="font-size: 11.5px; font-family: monospace; padding: 2px 8px; border-radius: 4px; background: #eef2ff; color: #4338ca; border: 1px solid #c7d2fe; font-weight: 600;">Sẵn sàng</span>
              </div>

              <div class="player-container" id="player-mount-point">
                <!-- Live iframe or player mounted here -->
              </div>

              <!-- SRemote Testing Toolbar: Row 1 - Main Playback Actions -->
              <div class="control-toolbar" style="margin-top: 10px;">
                <div class="btn-group" style="display: flex; flex-wrap: wrap; gap: 4px; width: 100%;">
                  <button type="button" class="btn btn-default btn-sm" onclick="triggerAction('previous')" id="btn-prev" title="Bài trước">⏮ Prev</button>
                  <button type="button" class="btn btn-default btn-sm" onclick="triggerAction('play')" id="btn-play">▶ Play</button>
                  <button type="button" class="btn btn-default btn-sm" onclick="triggerAction('pause')" id="btn-pause">⏸ Pause</button>
                  <button type="button" class="btn btn-default btn-sm" onclick="triggerAction('stop')" id="btn-stop">⏹ Stop</button>
                  <button type="button" class="btn btn-default btn-sm" onclick="triggerAction('toggle')" id="btn-toggle">🔄 Toggle</button>
                  <button type="button" class="btn btn-default btn-sm" onclick="triggerAction('next')" id="btn-next" title="Bài kế tiếp">⏭ Next</button>
                  <button type="button" class="btn btn-default btn-sm" onclick="triggerAction('seek', -10)" id="btn-seek-back">⏪ -10s</button>
                  <button type="button" class="btn btn-default btn-sm" onclick="triggerAction('seek', 10)" id="btn-seek-fwd">⏩ +10s</button>
                </div>
              </div>

              <!-- Seek Slider & Live Time: Row 2 -->
              <div class="seek-bar-container" style="margin: 8px 0;">
                <input type="range" class="seek-slider" id="preview-seek-slider" min="0" max="100" value="0" step="0.1" oninput="onSeekSliderInput(this.value)" onchange="onSeekSliderChange(this.value)">
                <span class="seek-time-label" id="preview-time-label">0:00 / 0:00</span>
              </div>

              <!-- Secondary Controls: Row 3 - Volume, Speed, Modes & Display (Clean Organized Layout) -->
              <div class="extra-controls-row" style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;">
                <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                  <div class="extra-control-item" style="display: flex; align-items: center; gap: 6px;">
                    <button type="button" class="btn btn-default btn-sm" onclick="triggerAction('mute')" id="btn-mute">🔇 Mute</button>
                    <input type="range" class="vol-slider" id="preview-vol-slider" min="0" max="1" step="0.01" value="1" style="width: 70px;" oninput="onVolumeSliderInput(this.value)" onchange="onVolumeSliderChange(this.value)">
                    <span class="vol-val-label" id="preview-vol-label" style="font-size: 11.5px; min-width: 32px;">100%</span>
                  </div>

                  <div class="extra-control-item" style="display: flex; align-items: center; gap: 4px;">
                    <label for="preview-rate-select" class="extra-control-label" id="label-rate" style="font-size: 12px; font-weight: 600;">Tốc độ:</label>
                    <select id="preview-rate-select" class="select-rate" style="padding: 2px 6px; border-radius: 4px; font-size: 12px;" onchange="onRateSelectChange(this.value)">
                      <option value="0.5">0.5x</option>
                      <option value="0.75">0.75x</option>
                      <option value="1" selected>1.0x</option>
                      <option value="1.25">1.25x</option>
                      <option value="1.5">1.5x</option>
                      <option value="2">2.0x</option>
                    </select>
                  </div>
                </div>

                <div style="display: flex; align-items: center; gap: 4px; flex-wrap: wrap;">
                  <button type="button" class="btn btn-default btn-sm" onclick="triggerAction('shuffle')" id="btn-shuffle" title="Bật/tắt trộn bài">🔀 Shuffle</button>
                  <button type="button" class="btn btn-default btn-sm" onclick="triggerAction('repeat')" id="btn-repeat" title="Chuyển chế độ lặp">🔁 Repeat</button>
                  <button type="button" class="btn btn-default btn-sm" onclick="triggerAction('pip')" id="btn-pip">🖼️ PiP</button>
                  <button type="button" class="btn btn-default btn-sm" onclick="triggerAction('fullscreen')" id="btn-fullscreen">⛶ Toàn màn hình</button>
                  <button type="button" class="btn btn-default btn-sm" onclick="reloadCurrentPlayer()" id="btn-reload" title="Nạp lại player">🔁 Nạp lại</button>
                </div>
              </div>

              <!-- Context Note Box -->
              <div class="note-box" id="platform-note-box" style="margin-top: 12px;">
                <!-- Context advice rendered here -->
              </div>
            </div>

          </div>
        </div>
      </div>
    </main>

  </div>

  <!-- Footer -->
  <footer class="footer">
    <div style="max-width: 1400px; margin: 0 auto; padding: 0 16px;">
      <p id="footer-text">
        SRemote Frame Controller &copy; 2026 sweetsea &bull; Giấy phép LGPL-3.0 &bull; Sẵn sàng cho mọi nền tảng Media.
      </p>
    </div>
  </footer>

  <!-- SRemote SDK Wrapper & Ready2Use Bundles -->
  <script src="../packages/wrapper/dist/index.global.js"></script>
  <script src="../packages/ready2use/dist/index.global.js"></script>

  <!-- Modular Scripts: Data -> Runtime -> UI -->
  <script src="assets/js/recipes-data.js"></script>
  <script src="assets/js/recipes-runtime.js"></script>
  <script src="assets/js/recipes-ui.js"></script>
</body>
</html>
