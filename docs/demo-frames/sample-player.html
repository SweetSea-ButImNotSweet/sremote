<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SRemote HTML5 Sample Player</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #0f1115;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    .video-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .watermark {
      position: absolute;
      top: 10px;
      left: 12px;
      font-size: 11px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.75);
      background: rgba(0, 0, 0, 0.5);
      padding: 3px 8px;
      border-radius: 3px;
      pointer-events: none;
      backdrop-filter: blur(4px);
    }
  </style>
</head>
<body>
  <div class="video-wrapper">
    <span class="watermark">🎬 SRemote HTML5 Native Frame</span>
    <!-- Big Buck Bunny open-source sample video via Wikimedia Commons -->
    <video
      id="native-video"
      src="https://upload.wikimedia.org/wikipedia/commons/transcoded/c/c0/Big_Buck_Bunny_4K.webm/Big_Buck_Bunny_4K.webm.480p.vp9.webm"
      controls
      autoplay
      muted
      playsinline
      crossorigin="anonymous"
      poster="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c0/Big_Buck_Bunny_4K.webm/640px--Big_Buck_Bunny_4K.webm.jpg"
    ></video>
  </div>
</body>
</html>
